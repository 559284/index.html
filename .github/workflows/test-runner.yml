name: Testt AWS Connection

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-central-1

      - name: Test AWS connection
        run: aws sts get-caller-identity

      - name: Deploy website to AWS webservers
        run: |
          aws ssm send-command \
            --instance-ids i-0bbc544663829a294 i-0d96412161098e947 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo docker exec nginx sh -c '\''cat > /usr/share/nginx/html/index.html <<\"EOF\"\n<h1>Innovatech Web Application</h1>\n<p>Deployed automatically with GitHub Actions.</p>\nEOF'\''"]' \
            --region eu-central-1
